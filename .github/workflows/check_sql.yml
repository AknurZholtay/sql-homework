name: Check SQL Homework

on:
  push:
    paths:
      - 'solution/**/*.sql'
  pull_request:
    paths:
      - 'solution/**/*.sql'

jobs:
  test-sql:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run student SQL
        env:
          PGPASSWORD: testpass
        run: |
          psql -h localhost -U testuser -d testdb \
            -f solution/homework.sql

      - name: Run tests
        env:
          PGPASSWORD: testpass
        run: |
          psql -h localhost -U testuser -d testdb \
            -f tests/check_ddl.sql
```
